AWSTemplateFormatVersion: '2010-09-09'
Description: 3-tier serverless bookstore demo (S3 + API Gateway + Lambda + DynamoDB)

Resources:
  BooksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Books
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BookStoreLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonDynamoDBReadOnlyAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  GetBooksFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GetBooks
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table('Books')

          def handler(event, context):
              response = table.scan()
              books = response.get('Items', [])
              for book in books:
                  book['price'] = float(book['price'])
              return {
                  'statusCode': 200,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*'
                  },
                  'body': json.dumps(books)
              }

  BookStoreApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: BookStoreAPI
      Description: API for bookstore demo

  BooksResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BookStoreApi
      ParentId: !GetAtt BookStoreApi.RootResourceId
      PathPart: books

  BooksGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BookStoreApi
      ResourceId: !Ref BooksResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetBooksFunction.Arn}/invocations

  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetBooksFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BookStoreApi}/*/GET/books

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: BooksGetMethod
    Properties:
      RestApiId: !Ref BookStoreApi
      StageName: prod

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bookstore-demo-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicRead
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${WebsiteBucket}/*

Outputs:
  WebsiteURL:
    Value: !GetAtt WebsiteBucket.WebsiteURL
    Description: S3 static website URL
  ApiURL:
    Value: !Sub https://${BookStoreApi}.execute-api.${AWS::Region}.amazonaws.com/prod/books
    Description: API Gateway endpoint for books
